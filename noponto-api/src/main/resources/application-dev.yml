# Carregado somente com o perfil dev.
# Ativa o DevDataSeeder (@Profile("dev")), que cria o admin admin@teste.com / 123456.
# Não usar em produção.
#
# Desenvolvimento local:
#   SPRING_PROFILES_ACTIVE=dev ./mvnw spring-boot:run

noponto:
  jwt:
    # Segredo apenas deste ambiente. Fora do dev, a API exige NOPONTO_JWT_SEGREDO.
    segredo: noponto-dev-segredo-jwt-trocar-em-producao-0123456789
  email:
    # Em dev o Mailpit escuta SMTP em localhost:1025 e exibe os e-mails em http://localhost:8025
    remetente: nao-responda@noponto.local
