server:
  port: 8080

spring:
  application:
    name: noponto
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/noponto_db}
    username: ${SPRING_DATASOURCE_USERNAME:noponto}
    password: ${SPRING_DATASOURCE_PASSWORD:noponto}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

noponto:
  tenant:
    # Rotas públicas resolvem o tenant pelo subdomínio: <tenant>.<dominio-base>
    dominio-base: ${NOPONTO_DOMINIO_BASE:noponto.com}
  jwt:
    # Em produção, defina NOPONTO_JWT_SEGREDO com no mínimo 32 bytes aleatórios
    segredo: ${NOPONTO_JWT_SEGREDO:noponto-dev-segredo-jwt-trocar-em-producao-0123456789}
    expiracao-minutos: ${NOPONTO_JWT_EXPIRACAO_MINUTOS:480}
