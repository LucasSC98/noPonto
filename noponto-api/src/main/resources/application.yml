server:
  port: 8080

spring:
  application:
    name: noponto
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/noponto_db}
    username: ${SPRING_DATASOURCE_USERNAME:noponto}
    password: ${SPRING_DATASOURCE_PASSWORD:noponto}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
